name: Build and Release

# - Cada push a main y cada pull request: tests + APK como artefacto del workflow.
# - Cada tag vX.Y.Z: además, publica una GitHub Release con el APK firmado, solo si también han pasado
#   los tests en el emulador, y después borra las releases y los tags anteriores.
#
# Todos los APK de release se firman con la misma clave (secrets del repositorio), así que se pueden
# instalar como actualización sin desinstalar la app ni perder sus datos. Ver README.md.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_KEYSTORE: ${{ secrets.SOCIOS_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version
        run: |
          # versionCode siempre creciente para que cada APK sea una actualización de la anterior.
          echo "SOCIOS_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "SOCIOS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "SOCIOS_VERSION_NAME=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          SOCIOS_KEYSTORE_BASE64: ${{ secrets.SOCIOS_KEYSTORE_BASE64 }}
        run: |
          echo "$SOCIOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SOCIOS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          SOCIOS_KEYSTORE_PASSWORD: ${{ secrets.SOCIOS_KEYSTORE_PASSWORD }}
          SOCIOS_KEY_ALIAS: ${{ secrets.SOCIOS_KEY_ALIAS }}
          SOCIOS_KEY_PASSWORD: ${{ secrets.SOCIOS_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "socios-${SOCIOS_VERSION_NAME}.apk"

      - name: Refuse to publish without signing key
        if: env.HAS_KEYSTORE != 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Faltan los secrets de firma (SOCIOS_KEYSTORE_BASE64...). Una release firmada con otra clave no se podría instalar como actualización. Ver README.md."
          exit 1

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Sin clave de firma: se genera un APK debug solo para pruebas, no apto para actualizar instalaciones existentes."
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "socios-${SOCIOS_VERSION_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: socios-${{ env.SOCIOS_VERSION_NAME }}
          path: socios-*.apk

  # Tests en un emulador: migraciones de Room, el DAO y los flujos principales de la pantalla. Van en
  # paralelo al build, y la release espera a los dos (ver el job release).
  instrumented-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # El emulador ya arrancado se guarda en caché (una vez, desde main; los tags la leen de ahí): así no se
      # crea ni se arranca en frío en cada ejecución. Las opciones deben ser las mismas en los dos pasos.
      - name: Cache emulator
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulador guardado para la caché."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-tests-emulador
          path: app/build/reports/androidTests/

  # Solo con un tag, y solo si el build y los tests en el emulador han pasado: una migración rota no debe
  # llegar a la release, porque la app la instala sola y podría estropear los datos al actualizar.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, instrumented-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          pattern: socios-*
          merge-multiple: true
          path: apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "APK firmado generado automáticamente para `${{ github.ref_name }}`."
          files: apk/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Solo se deja la última release. Antes de borrar nada se comprueba que la nueva está publicada y lleva
      # el APK, porque la app se actualiza desde ella. Se borran también los tags vX.Y.Z sin release (los de
      # una CI que falló).
      - name: Delete previous releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apks=$(gh release view "$TAG" --json isDraft,assets \
            --jq 'select(.isDraft | not) | [.assets[].name | select(endswith(".apk"))] | length')
          if [ "${apks:-0}" -lt 1 ]; then
            echo "::error::La release $TAG no está publicada con su APK: no se borra ninguna anterior."
            exit 1
          fi
          # Solo las versiones menores: si dos releases coinciden, la más antigua no borra la nueva.
          anterior() { [ "$1" != "$TAG" ] && [ "$(printf '%s\n%s\n' "$1" "$TAG" | sort -V | head -n 1)" = "$1" ]; }
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r t; do
            if anterior "$t"; then
              echo "Borrando la release $t"
              gh release delete "$t" --yes --cleanup-tag
            fi
          done
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' | while read -r t; do
            if anterior "$t"; then
              echo "Borrando el tag $t"
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t"
            fi
          done
