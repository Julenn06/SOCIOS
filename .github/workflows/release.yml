name: Build and Create Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare APK file
        id: prepare_apk
        run: |
          TAG_NAME="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          NEW_APK_PATH="socios-${TAG_NAME}.apk"
          cp "$APK_PATH" "$NEW_APK_PATH"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$NEW_APK_PATH" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: Release ${{ steps.prepare_apk.outputs.tag_name }}
          body: "APK generado automáticamente tras el push a la rama `${{ github.ref_name }}`."
          files: ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
