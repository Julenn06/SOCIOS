# Avisos semanales de nuevas versiones de dependencias de Gradle y mensuales de las GitHub Actions.
# Las actualizaciones menores y de parche se agrupan en un único pull request.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencias:
        update-types: ["minor", "patch"]
    ignore:
      # Desde la 1.12 necesita Kotlin 2.4 y la app compila con el Kotlin 2.2 que trae AGP: subirla junto
      # con AGP, a mano. Ver gradle/libs.versions.toml.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        versions: [">= 1.12.0"]
      # El plugin de serialización va en la versión de Kotlin de AGP: subirlo cambia el Kotlin de todo el
      # proyecto. Se sube a mano junto con AGP.
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
