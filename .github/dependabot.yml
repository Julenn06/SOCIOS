# Avisos semanales de nuevas versiones de dependencias de Gradle y mensuales de las GitHub Actions.
# Las actualizaciones menores y de parche se agrupan en un único pull request.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencias:
        update-types: ["minor", "patch"]
    ignore:
      # El plugin de serialización fija la versión de Kotlin de todo el proyecto: se sube a mano, comprobando
      # que KSP y Room siguen funcionando. Ver gradle/libs.versions.toml.
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
